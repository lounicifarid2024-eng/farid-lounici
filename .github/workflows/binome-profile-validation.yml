name: Binôme Intelligent Profile Validation

on:
  push:
    branches: ["main", "feat/binome-intelligent-profile-v1"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependency
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Validate manifest directly
        run: python src/validate_binome_profile.py

      - name: Run governance tests
        run: python -m pytest -q
